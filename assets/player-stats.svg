<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="215" viewBox="0 0 1000 215" role="img" aria-label="Character Sheet and Language Mastery HUD">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c15"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="barGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8892b"/>
      <stop offset="100%" stop-color="#f6e6a8"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00e0ff"/>
    </linearGradient>
    <linearGradient id="barOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#ff9e44"/>
    </linearGradient>
  </defs>

  <!-- Main HUD Card -->
  <polygon points="18,4 982,4 996,18 996,197 982,211 18,211 4,197 4,18"
           fill="url(#panelBg)" stroke="#d4af37" stroke-opacity="0.38" stroke-width="1.2"/>

  <!-- Corner Accents -->
  <path d="M 4 32 L 4 18 L 18 4 L 40 4" fill="none" stroke="#00e0ff" stroke-width="2"/>
  <path d="M 960 211 L 982 211 L 996 197 L 996 183" fill="none" stroke="#ff6a00" stroke-width="2"/>

  <!-- Center Divider -->
  <line x1="528" y1="22" x2="528" y2="193" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Left Panel: Character Sheet -->
  <text x="28" y="34" fill="#d4af37" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" letter-spacing="1.8">
    [ CHARACTER_SHEET // CORE ATTRIBUTES ]
  </text>
  <line x1="28" y1="44" x2="504" y2="44" stroke="#00e0ff" stroke-opacity="0.25" stroke-width="1"/>

  <g font-family="Consolas, 'Courier New', monospace" font-size="12.5">
    <text x="28" y="72" fill="#00e0ff" font-weight="700">CLASS</text>
    <text x="86" y="72" fill="#64748b">:</text>
    <text x="102" y="72" fill="#e2e8f0" font-family="'Segoe UI', Inter, sans-serif">Gameplay Programmer (Unity &amp; C#)</text>

    <text x="28" y="101" fill="#00e0ff" font-weight="700">GUILD</text>
    <text x="86" y="101" fill="#64748b">:</text>
    <text x="102" y="101" fill="#e2e8f0" font-family="'Segoe UI', Inter, sans-serif">Technos College Tokyo &#x00B7; Game Creator Dept.</text>

    <text x="28" y="130" fill="#00e0ff" font-weight="700">QUEST</text>
    <text x="86" y="130" fill="#64748b">:</text>
    <text x="102" y="130" fill="#e2e8f0" font-family="'Segoe UI', Inter, sans-serif">Commercial Game QA Tester @ Lionbridge</text>

    <text x="28" y="159" fill="#00e0ff" font-weight="700">CRAFT</text>
    <text x="86" y="159" fill="#64748b">:</text>
    <text x="102" y="159" fill="#e2e8f0" font-family="'Segoe UI', Inter, sans-serif">3D Maya Environments &#x00B7; Pixel Art &#x00B7; Sound Design</text>

    <text x="28" y="188" fill="#00e0ff" font-weight="700">GEAR</text>
    <text x="86" y="188" fill="#64748b">:</text>
    <text x="102" y="188" fill="#e2e8f0" font-family="'Segoe UI', Inter, sans-serif">Custom PC Builder &amp; Diagnostics (Since 2019)</text>
  </g>

  <!-- Right Panel: Language Mastery -->
  <text x="554" y="34" fill="#00e0ff" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" letter-spacing="1.8">
    [ LANGUAGE_MASTERY // LOCALIZATION_HUD ]
  </text>
  <line x1="554" y1="44" x2="972" y2="44" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Arabic (100%) -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="11.5">
    <text x="554" y="72" fill="#f6e6a8" font-weight="700">ARABIC</text>
    <text x="720" y="72" text-anchor="end" fill="#d4af37">NATIVE</text>
    <rect x="734" y="61" width="194" height="12" rx="3" fill="#141d31" stroke="#334155" stroke-width="0.8"/>
    <rect x="735" y="62" width="192" height="10" rx="2" fill="url(#barGold)"/>
    <text x="972" y="72" text-anchor="end" fill="#f6e6a8" font-weight="700">100%</text>

    <!-- Japanese (80%) -->
    <text x="554" y="109" fill="#e2e8f0" font-weight="700">JAPANESE</text>
    <text x="720" y="109" text-anchor="end" fill="#00e0ff">JLPT N2</text>
    <rect x="734" y="98" width="194" height="12" rx="3" fill="#141d31" stroke="#334155" stroke-width="0.8"/>
    <rect x="735" y="99" width="154" height="10" rx="2" fill="url(#barCyan)"/>
    <text x="972" y="109" text-anchor="end" fill="#00e0ff" font-weight="700">80%</text>

    <!-- Turkish (80%) -->
    <text x="554" y="146" fill="#e2e8f0" font-weight="700">TURKISH</text>
    <text x="720" y="146" text-anchor="end" fill="#00e0ff">CERTIFIED C1</text>
    <rect x="734" y="135" width="194" height="12" rx="3" fill="#141d31" stroke="#334155" stroke-width="0.8"/>
    <rect x="735" y="136" width="154" height="10" rx="2" fill="url(#barCyan)"/>
    <text x="972" y="146" text-anchor="end" fill="#00e0ff" font-weight="700">80%</text>

    <!-- English (65%) -->
    <text x="554" y="183" fill="#e2e8f0" font-weight="700">ENGLISH</text>
    <text x="720" y="183" text-anchor="end" fill="#ff9e44">TECH / CONV.</text>
    <rect x="734" y="172" width="194" height="12" rx="3" fill="#141d31" stroke="#334155" stroke-width="0.8"/>
    <rect x="735" y="173" width="125" height="10" rx="2" fill="url(#barOrange)"/>
    <text x="972" y="183" text-anchor="end" fill="#ff9e44" font-weight="700">65%</text>
  </g>
</svg>
